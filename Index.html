<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SunTrack CRM - Solar Lead Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981', // Emerald for solar/green energy
                            600: '#059669',
                            700: '#047857',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Feather Icons for lightweight, crisp SVG icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Hide sidebar on mobile by default */
        @media (max-width: 768px) {
            .sidebar-open { transform: translateX(0); }
            .sidebar-closed { transform: translateX(-100%); }
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden antialiased">

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar-closed md:translate-x-0 fixed md:static inset-y-0 left-0 z-40 w-64 bg-white border-r border-slate-200 transition-transform duration-300 ease-in-out flex flex-col shadow-xl md:shadow-none">
        <div class="p-6 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-brand-500 flex items-center justify-center text-white font-bold">
                    <i data-feather="sun" class="w-5 h-5"></i>
                </div>
                <span class="text-xl font-bold tracking-tight text-slate-800">SunTrack</span>
            </div>
            <button class="md:hidden text-slate-500 hover:text-slate-700" onclick="toggleSidebar()">
                <i data-feather="x"></i>
            </button>
        </div>

        <nav class="flex-1 px-4 space-y-1 overflow-y-auto">
            <button onclick="navigate('dashboard')" id="nav-dashboard" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left font-medium transition-colors bg-brand-50 text-brand-700">
                <i data-feather="grid" class="w-5 h-5"></i> Dashboard
            </button>
            <button onclick="navigate('leads')" id="nav-leads" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-colors">
                <i data-feather="users" class="w-5 h-5"></i> All Leads
            </button>
            <button onclick="navigate('followups')" id="nav-followups" class="nav-btn w-full flex items-center justify-between px-4 py-3 rounded-xl text-left font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-colors">
                <div class="flex items-center gap-3">
                    <i data-feather="clock" class="w-5 h-5"></i> Follow-ups
                </div>
                <span id="nav-badge-followup" class="bg-red-100 text-red-600 py-0.5 px-2 rounded-full text-xs font-bold hidden">0</span>
            </button>
            <button onclick="navigate('add-lead')" id="nav-add-lead" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-colors">
                <i data-feather="plus-circle" class="w-5 h-5"></i> Add New Lead
            </button>
            
            <div class="pt-6 pb-2">
                <p class="px-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">System Settings</p>
            </div>
            <button onclick="navigate('data')" id="nav-data" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-colors">
                <i data-feather="database" class="w-5 h-5"></i> Data & Backup
            </button>
        </nav>

        <div class="p-4 border-t border-slate-200">
            <div class="bg-slate-50 rounded-xl p-4 border border-slate-100">
                <p class="text-xs text-slate-500 font-medium">Running Locally</p>
                <p class="text-[10px] text-slate-400 mt-1">Data is stored in-memory. Remember to backup via JSON export.</p>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen min-w-0 bg-slate-50">
        <!-- Header -->
        <header class="h-16 glass-panel border-b border-slate-200 flex items-center justify-between px-4 sm:px-6 lg:px-8 z-10">
            <div class="flex items-center gap-4">
                <button class="md:hidden text-slate-500 hover:text-slate-900" onclick="toggleSidebar()">
                    <i data-feather="menu"></i>
                </button>
                <h1 id="page-title" class="text-xl font-semibold text-slate-800">Dashboard</h1>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="navigate('add-lead')" class="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm hidden sm:flex items-center gap-2">
                    <i data-feather="plus" class="w-4 h-4"></i> New Lead
                </button>
            </div>
        </header>

        <!-- Content Area -->
        <div id="content-area" class="flex-1 overflow-auto p-4 sm:p-6 lg:p-8">
            <!-- Views will be injected here -->
        </div>
    </main>

    <!-- Custom Modal Overlay -->
    <div id="custom-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 transform transition-all scale-95 opacity-0" id="modal-content">
            <div class="flex items-start gap-4">
                <div id="modal-icon" class="w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0"></div>
                <div class="flex-1">
                    <h3 id="modal-title" class="text-lg font-semibold text-slate-900"></h3>
                    <p id="modal-message" class="text-sm text-slate-500 mt-2"></p>
                </div>
            </div>
            <div class="mt-6 flex justify-end gap-3" id="modal-actions">
                <!-- Buttons injected via JS -->
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <!-- ==================== TEMPLATES ==================== -->
    
    <!-- Template: Dashboard -->
    <template id="tpl-dashboard">
        <div class="fade-in space-y-6">
            <!-- Stats Grid -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 sm:gap-6">
                <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                    <div class="text-sm font-medium text-slate-500 mb-1">Total Leads</div>
                    <div class="text-3xl font-bold text-slate-800" id="stat-total">0</div>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm relative overflow-hidden">
                    <div class="absolute right-0 top-0 w-16 h-16 bg-blue-50 rounded-bl-full -mr-4 -mt-4"></div>
                    <div class="text-sm font-medium text-blue-600 mb-1 relative">New Leads</div>
                    <div class="text-3xl font-bold text-slate-800 relative" id="stat-new">0</div>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm relative overflow-hidden cursor-pointer hover:border-orange-200 transition-colors" onclick="navigate('followups')">
                    <div class="absolute right-0 top-0 w-16 h-16 bg-orange-50 rounded-bl-full -mr-4 -mt-4"></div>
                    <div class="text-sm font-medium text-orange-600 mb-1 relative">Follow-ups Today</div>
                    <div class="text-3xl font-bold text-slate-800 relative" id="stat-today">0</div>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm relative overflow-hidden cursor-pointer hover:border-red-200 transition-colors" onclick="navigate('followups')">
                    <div class="absolute right-0 top-0 w-16 h-16 bg-red-50 rounded-bl-full -mr-4 -mt-4"></div>
                    <div class="text-sm font-medium text-red-600 mb-1 relative">Overdue</div>
                    <div class="text-3xl font-bold text-slate-800 relative" id="stat-overdue">0</div>
                </div>
                
                <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                    <div class="text-sm font-medium text-emerald-600 mb-1">Converted (Won)</div>
                    <div class="text-2xl sm:text-3xl font-bold text-slate-800" id="stat-won">0</div>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                    <div class="text-sm font-medium text-slate-500 mb-1">Lost</div>
                    <div class="text-2xl sm:text-3xl font-bold text-slate-800" id="stat-lost">0</div>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm col-span-2 bg-gradient-to-br from-brand-50 to-white">
                    <div class="text-sm font-medium text-brand-700 mb-1">Est. Pipeline Value</div>
                    <div class="text-3xl sm:text-4xl font-bold text-slate-800" id="stat-value">₹0</div>
                </div>
            </div>

            <!-- Recent Leads Overview -->
            <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden mt-8">
                <div class="px-6 py-5 border-b border-slate-100 flex justify-between items-center">
                    <h3 class="text-lg font-semibold text-slate-800">Recent Leads</h3>
                    <button onclick="navigate('leads')" class="text-sm font-medium text-brand-600 hover:text-brand-700">View All</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs text-slate-500 bg-slate-50 uppercase font-semibold">
                            <tr>
                                <th class="px-6 py-4">Customer Name</th>
                                <th class="px-6 py-4">Requirement</th>
                                <th class="px-6 py-4">Status</th>
                                <th class="px-6 py-4">Next Follow-up</th>
                            </tr>
                        </thead>
                        <tbody id="dash-recent-leads" class="divide-y divide-slate-100">
                            <!-- Populated via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </template>

    <!-- Template: Lead Form -->
    <template id="tpl-lead-form">
        <div class="fade-in max-w-4xl mx-auto">
            <form id="lead-form" class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden" onsubmit="saveLead(event)">
                <input type="hidden" id="form-id">
                
                <div class="px-6 py-5 border-b border-slate-100 bg-slate-50/50">
                    <h3 class="text-lg font-semibold text-slate-800" id="form-title">Add New Solar Lead</h3>
                </div>

                <div class="p-6 sm:p-8 space-y-8">
                    <!-- Customer Info -->
                    <div>
                        <h4 class="text-sm font-semibold text-brand-600 uppercase tracking-wider mb-4 border-b pb-2">Customer Details</h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Customer Name *</label>
                                <input type="text" id="form-name" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-200 outline-none transition-all">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Mobile Number *</label>
                                <input type="tel" id="form-mobile" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-200 outline-none transition-all">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-sm font-medium text-slate-700 mb-1">Location / Address</label>
                                <input type="text" id="form-location" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-200 outline-none transition-all">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Lead Source</label>
                                <select id="form-source" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-200 outline-none transition-all bg-white">
                                    <option value="WhatsApp">WhatsApp</option>
                                    <option value="Instagram">Instagram</option>
                                    <option value="Referral">Referral</option>
                                    <option value="Website">Website</option>
                                    <option value="Call">Direct Call</option>
                                    <option value="Walk-in">Walk-in</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Customer Type</label>
                                <select id="form-type" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-200 outline-none transition-all bg-white">
                                    <option value="Residential">Residential</option>
                                    <option value="Commercial">Commercial</option>
                                    <option value="Industrial">Industrial</option>
                                    <option value="Agricultural">Agricultural</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Solar Specifics -->
                    <div>
                        <h4 class="text-sm font-semibold text-brand-600 uppercase tracking-wider mb-4 border-b pb-2">Solar Requirements</h4>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Required Capacity (kW)</label>
                                <input type="number" step="0.1" id="form-kw" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-200 outline-none transition-all" placeholder="e.g. 5">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">System Type</label>
                                <select id="form-sysType" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-200 outline-none transition-all bg-white">
                                    <option value="On-grid">On-grid</option>
                                    <option value="Hybrid">Hybrid</option>
                                    <option value="Off-grid">Off-grid</option>
                                    <option value="Undecided">Undecided</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Subsidy Required?</label>
                                <select id="form-subsidy" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-200 outline-none transition-all bg-white">
                                    <option value="Yes">Yes</option>
                                    <option value="No">No</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Est. Project Value</label>
                                <input type="number" id="form-value" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-200 outline-none transition-all" placeholder="Amount">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Quotation Status</label>
                                <select id="form-quotaStatus" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-200 outline-none transition-all bg-white">
                                    <option value="Pending">Pending</option>
                                    <option value="Sent">Sent</option>
                                    <option value="Accepted">Accepted</option>
                                    <option value="Rejected">Rejected</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Site Survey Status</label>
                                <select id="form-siteStatus" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-200 outline-none transition-all bg-white">
                                    <option value="Not Scheduled">Not Scheduled</option>
                                    <option value="Scheduled">Scheduled</option>
                                    <option value="Completed">Completed</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Pipeline & Tracking -->
                    <div>
                        <h4 class="text-sm font-semibold text-brand-600 uppercase tracking-wider mb-4 border-b pb-2">Pipeline Management</h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Lead Status *</label>
                                <select id="form-status" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-200 outline-none transition-all bg-white font-semibold">
                                    <option value="New">🟢 New Lead</option>
                                    <option value="Contacted">🔵 Contacted</option>
                                    <option value="Follow-up">🟡 Follow-up Required</option>
                                    <option value="Site Visit">🟣 Site Visit</option>
                                    <option value="Negotiation">🟠 Negotiation</option>
                                    <option value="Won">🏆 Won (Converted)</option>
                                    <option value="Lost">❌ Lost</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Next Follow-up Date/Time</label>
                                <input type="datetime-local" id="form-nextDate" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-200 outline-none transition-all">
                            </div>
                            <div class="md:col-span-2 hidden" id="div-lost-reason">
                                <label class="block text-sm font-medium text-red-700 mb-1">Reason for Loss</label>
                                <input type="text" id="form-lostReason" class="w-full px-4 py-2.5 rounded-xl border border-red-200 focus:border-red-500 focus:ring-2 focus:ring-red-200 outline-none transition-all" placeholder="e.g., Price too high, went with competitor...">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-sm font-medium text-slate-700 mb-1">General Notes</label>
                                <textarea id="form-notes" rows="3" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-200 outline-none transition-all resize-none"></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="px-6 py-4 border-t border-slate-100 bg-slate-50 flex justify-end gap-3">
                    <button type="button" onclick="navigate('leads')" class="px-5 py-2.5 text-sm font-medium text-slate-600 hover:text-slate-900 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 transition-colors">Cancel</button>
                    <button type="submit" class="px-5 py-2.5 text-sm font-medium text-white bg-brand-600 rounded-xl hover:bg-brand-700 shadow-sm transition-colors flex items-center gap-2">
                        <i data-feather="save" class="w-4 h-4"></i> Save Lead
                    </button>
                </div>
            </form>
        </div>
    </template>

    <!-- Template: All Leads -->
    <template id="tpl-leads">
        <div class="fade-in space-y-6">
            <div class="flex flex-col sm:flex-row gap-4 justify-between items-start sm:items-center">
                <div class="relative w-full sm:w-96">
                    <i data-feather="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                    <input type="text" id="search-leads" placeholder="Search name, mobile, location..." class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-200 outline-none transition-all shadow-sm" onkeyup="filterLeads()">
                </div>
                <div class="flex gap-2 w-full sm:w-auto">
                    <select id="filter-status" class="flex-1 sm:flex-none px-4 py-2.5 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-200 outline-none transition-all shadow-sm bg-white" onchange="filterLeads()">
                        <option value="">All Statuses</option>
                        <option value="New">New</option>
                        <option value="Contacted">Contacted</option>
                        <option value="Follow-up">Follow-up</option>
                        <option value="Site Visit">Site Visit</option>
                        <option value="Won">Won</option>
                        <option value="Lost">Lost</option>
                    </select>
                </div>
            </div>

            <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs text-slate-500 bg-slate-50 uppercase font-semibold">
                            <tr>
                                <th class="px-6 py-4">Customer</th>
                                <th class="px-6 py-4">Requirement</th>
                                <th class="px-6 py-4">Status</th>
                                <th class="px-6 py-4">Next Action</th>
                                <th class="px-6 py-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="leads-table-body" class="divide-y divide-slate-100">
                            <!-- Populated via JS -->
                        </tbody>
                    </table>
                </div>
                <!-- Empty State -->
                <div id="leads-empty" class="hidden flex flex-col items-center justify-center py-12 px-4 text-center">
                    <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mb-4">
                        <i data-feather="inbox" class="w-8 h-8 text-slate-400"></i>
                    </div>
                    <h3 class="text-lg font-medium text-slate-900 mb-1">No leads found</h3>
                    <p class="text-slate-500 mb-4 max-w-sm">You haven't added any leads yet, or none match your search criteria.</p>
                    <button onclick="navigate('add-lead')" class="text-brand-600 font-medium hover:text-brand-700">Add your first lead &rarr;</button>
                </div>
            </div>
        </div>
    </template>

    <!-- Template: Follow-ups -->
    <template id="tpl-followups">
        <div class="fade-in space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Overdue -->
                <div class="bg-white rounded-2xl border border-red-100 shadow-sm overflow-hidden flex flex-col">
                    <div class="px-5 py-4 border-b border-red-50 bg-red-50/50 flex justify-between items-center">
                        <h3 class="font-semibold text-red-800 flex items-center gap-2">
                            <i data-feather="alert-circle" class="w-4 h-4"></i> Overdue Follow-ups
                        </h3>
                        <span class="bg-red-100 text-red-700 text-xs font-bold px-2.5 py-1 rounded-full" id="count-overdue">0</span>
                    </div>
                    <div class="p-2 flex-1 overflow-y-auto max-h-[60vh]" id="list-overdue">
                        <!-- Populated via JS -->
                    </div>
                </div>

                <!-- Today -->

    <script>
        // State Management
        let appState = {
            leads: [],
            currentView: 'dashboard',
            activeLeadId: null
        };

        // Utility: Generate Unique ID
        const generateId = () => Math.random().toString(36).substr(2, 9) + Date.now().toString(36);

        // Utility: Format Date
        const formatDate = (dateString, includeTime = false) => {
            if (!dateString) return '-';
            const d = new Date(dateString);
            const opts = { day: 'numeric', month: 'short', year: 'numeric' };
            if (includeTime) {
                opts.hour = '2-digit';
                opts.minute = '2-digit';
            }
            return d.toLocaleDateString('en-IN', opts);
        };

        // Utility: Currency Formatter (₹)
        const formatCurrency = (val) => {
            if (!val) return '-';
            return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(val);
        };

        // Initialize Mock Data on First Load (for demonstration)
        const initMockData = () => {
            const today = new Date();
            const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1);
            const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
            
            const fmt = (d) => d.toISOString().slice(0, 16);

            appState.leads = [
                {
                    id: generateId(), name: "Rajesh Sharma", mobile: "9876543210", location: "Mumbai, MH",
                    source: "Website", type: "Residential", kw: 5, sysType: "On-grid", subsidy: "Yes",
                    estValue: 250000, status: "Follow-up", nextDate: fmt(today), quotaStatus: "Sent",
                    siteStatus: "Completed", notes: "Customer visited site. Discussed panel brands.",
                    createdAt: new Date().toISOString(), history: [{ date: new Date().toISOString(), note: "Initial entry", status: "New" }]
                },
                {
                    id: generateId(), name: "GreenTech Industries", mobile: "9988776655", location: "Pune, MH",
                    source: "Referral", type: "Commercial", kw: 50, sysType: "Hybrid", subsidy: "No",
                    estValue: 2500000, status: "New", nextDate: fmt(tomorrow), quotaStatus: "Pending",
                    siteStatus: "Not Scheduled", notes: "Needs a factory roof survey.",
                    createdAt: new Date().toISOString(), history: []
                },
                {
                    id: generateId(), name: "Anil Desai", mobile: "8899001122", location: "Nashik, MH",
                    source: "WhatsApp", type: "Agricultural", kw: 10, sysType: "Off-grid", subsidy: "Yes",
                    estValue: 600000, status: "Site Visit", nextDate: fmt(yesterday), quotaStatus: "Pending",
                    siteStatus: "Scheduled", notes: "Wants solar water pump integration.",
                    createdAt: new Date().toISOString(), history: []
                }
            ];
        };

        // Run once on load
        if (appState.leads.length === 0) {
            initMockData();
        }

        // Navigation Logic
        function navigate(view, leadId = null) {
            appState.currentView = view;
            appState.activeLeadId = leadId;

            // Update UI Sidebar
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-brand-50', 'text-brand-700');
                btn.classList.add('text-slate-600');
            });
            const activeBtn = document.getElementById(`nav-${view === 'profile' ? 'leads' : view}`);
            if (activeBtn) {
                activeBtn.classList.remove('text-slate-600');
                activeBtn.classList.add('bg-brand-50', 'text-brand-700');
            }

            // Close sidebar on mobile
            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.remove('sidebar-open');
                document.getElementById('sidebar').classList.add('sidebar-closed');
            }

            // Titles map
            const titles = {
                'dashboard': 'Dashboard', 'leads': 'All Leads', 'followups': 'Follow-ups',
                'add-lead': leadId ? 'Edit Lead' : 'Add New Lead', 'profile': 'Lead Profile', 'data': 'System Data'
            };
            document.getElementById('page-title').innerText = titles[view] || 'Dashboard';

            // Render content
            const contentArea = document.getElementById('content-area');
            const template = document.getElementById(`tpl-${view === 'add-lead' ? 'lead-form' : view}`);
            
            contentArea.innerHTML = '';
            if (template) {
                contentArea.appendChild(template.content.cloneNode(true));
            }

            // Execute specific view logic
            if (view === 'dashboard') renderDashboard();
            if (view === 'leads') filterLeads();
            if (view === 'add-lead' && leadId) populateForm(leadId);
            if (view === 'profile' && leadId) renderProfile(leadId);
            if (view === 'followups') renderFollowUps();

            // Form dynamic field toggle
            if (view === 'add-lead') {
                document.getElementById('form-status').addEventListener('change', (e) => {
                    document.getElementById('div-lost-reason').classList.toggle('hidden', e.target.value !== 'Lost');
                });
            }

            feather.replace();
            updateGlobalBadges();
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('sidebar-open');
            sidebar.classList.toggle('sidebar-closed');
        }

        // View Renders
        function renderDashboard() {
            const leads = appState.leads;
            
            // Stats
            document.getElementById('stat-total').innerText = leads.length;
            document.getElementById('stat-new').innerText = leads.filter(l => l.status === 'New').length;
            document.getElementById('stat-won').innerText = leads.filter(l => l.status === 'Won').length;
            document.getElementById('stat-lost').innerText = leads.filter(l => l.status === 'Lost').length;
            
            const pipelineValue = leads.filter(l => l.status !== 'Lost' && l.status !== 'Won').reduce((sum, l) => sum + (Number(l.estValue) || 0), 0);
            document.getElementById('stat-value').innerText = formatCurrency(pipelineValue);

            const todayStr = new Date().toISOString().slice(0, 10);
            let todayCount = 0, overdueCount = 0;

            leads.forEach(l => {
                if (!l.nextDate || l.status === 'Won' || l.status === 'Lost') return;
                const nextD = l.nextDate.slice(0, 10);
                if (nextD === todayStr) todayCount++;
                else if (nextD < todayStr) overdueCount++;
            });
            document.getElementById('stat-today').innerText = todayCount;
            document.getElementById('stat-overdue').innerText = overdueCount;

            // Recent Leads Table
            const recent = [...leads].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 5);
            const tbody = document.getElementById('dash-recent-leads');
            tbody.innerHTML = '';
            recent.forEach(l => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition-colors cursor-pointer" onclick="navigate('profile', '${l.id}')">
                        <td class="px-6 py-4 font-medium text-slate-800">${l.name}</td>
                        <td class="px-6 py-4 text-slate-600">${l.kw ? l.kw + 'kW ' : ''}${l.type}</td>
                        <td class="px-6 py-4">${getStatusBadge(l.status)}</td>
                        <td class="px-6 py-4 text-slate-600">${formatDate(l.nextDate)}</td>
                    </tr>
                `;
            });
        }

        function getStatusBadge(status) {
            const colors = {
                'New': 'bg-emerald-100 text-emerald-700 border-emerald-200',
                'Contacted': 'bg-blue-100 text-blue-700 border-blue-200',
                'Follow-up': 'bg-orange-100 text-orange-700 border-orange-200',
                'Site Visit': 'bg-purple-100 text-purple-700 border-purple-200',
                'Negotiation': 'bg-yellow-100 text-yellow-700 border-yellow-200',
                'Won': 'bg-green-500 text-white border-green-600',
                'Lost': 'bg-red-100 text-red-700 border-red-200'
            };
            return `<span class="px-2.5 py-1 text-xs font-semibold rounded-full border ${colors[status] || 'bg-gray-100 text-gray-700'}">${status}</span>`;
        }

        function filterLeads() {
            const searchTerm = (document.getElementById('search-leads')?.value || '').toLowerCase();
            const statusFilter = document.getElementById('filter-status')?.value || '';
            
            const filtered = appState.leads.filter(l => {
                const matchesSearch = (l.name + l.mobile + l.location).toLowerCase().includes(searchTerm);
                const matchesStatus = statusFilter === '' || l.status === statusFilter;
                return matchesSearch && matchesStatus;
            });

            const tbody = document.getElementById('leads-table-body');
            const emptyState = document.getElementById('leads-empty');
            
            if(!tbody) return; // safety

            if (filtered.length === 0) {
                tbody.parentElement.classList.add('hidden');
                emptyState.classList.remove('hidden');
            } else {
                tbody.parentElement.classList.remove('hidden');
                emptyState.classList.add('hidden');
                tbody.innerHTML = '';
                filtered.forEach(l => {
                    const waLink = `https://wa.me/${l.mobile.replace(/\D/g, '')}`;
                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50 transition-colors bg-white">
                            <td class="px-6 py-4">
                                <div class="font-medium text-slate-900">${l.name}</div>
                                <div class="text-xs text-slate-500 mt-0.5 flex gap-2"><span>${l.mobile}</span> <span>${l.location||''}</span></div>
                            </td>
                            <td class="px-6 py-4 text-slate-600 text-sm">
                                ${l.kw ? `<b>${l.kw}kW</b> ` : ''}${l.sysType}<br>
                                <span class="text-xs text-slate-400">${formatCurrency(l.estValue)}</span>
                            </td>
                            <td class="px-6 py-4">${getStatusBadge(l.status)}</td>
                            <td class="px-6 py-4 text-sm text-slate-600 font-medium whitespace-nowrap">
                                ${l.nextDate ? formatDate(l.nextDate, true) : 'No date set'}
                            </td>
                            <td class="px-6 py-4 text-right">
                                <div class="flex items-center justify-end gap-2">
                                    <a href="${waLink}" target="_blank" class="p-2 text-green-600 hover:bg-green-50 rounded-lg transition-colors" title="WhatsApp">
                                        <i data-feather="message-circle" class="w-4 h-4"></i>
                                    </a>
                                    <button onclick="confirmDeleteLead('${l.id}')" class="p-2 text-red-400 hover:bg-red-50 hover:text-red-600 rounded-lg transition-colors" title="Delete Lead">
                                        <i data-feather="trash-2" class="w-4 h-4"></i>
                                    </button>
                                    <button onclick="navigate('profile', '${l.id}')" class="p-2 text-brand-600 hover:bg-brand-50 rounded-lg transition-colors" title="View Profile">
                                        <i data-feather="chevron-right" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
                feather.replace();
            }
        }

        function saveLead(e) {
            e.preventDefault();
            const id = document.getElementById('form-id').value;
            const newLead = {
                id: id || generateId(),
                name: document.getElementById('form-name').value,
                mobile: document.getElementById('form-mobile').value,
                location: document.getElementById('form-location').value,
                source: document.getElementById('form-source').value,
                type: document.getElementById('form-type').value,
                kw: document.getElementById('form-kw').value,
                sysType: document.getElementById('form-sysType').value,
                subsidy: document.getElementById('form-subsidy').value,
                estValue: document.getElementById('form-value').value,
                quotaStatus: document.getElementById('form-quotaStatus').value,
                siteStatus: document.getElementById('form-siteStatus').value,
                status: document.getElementById('form-status').value,
                nextDate: document.getElementById('form-nextDate').value,
                notes: document.getElementById('form-notes').value,
                lostReason: document.getElementById('form-lostReason').value,
                createdAt: id ? undefined : new Date().toISOString(), // Only set on create
                history: id ? undefined : []
            };

            if (id) {
                const idx = appState.leads.findIndex(l => l.id === id);
                // Merge to keep createdAt and history
                appState.leads[idx] = { ...appState.leads[idx], ...newLead };
                showToast('Lead updated successfully!', 'success');
                navigate('profile', id);
            } else {
                appState.leads.push(newLead);
                showToast('New lead added!', 'success');
                navigate('leads');
            }
        }

        function populateForm(id) {
            const lead = appState.leads.find(l => l.id === id);
            if(!lead) return;
            document.getElementById('form-title').innerText = 'Edit Lead';
            document.getElementById('form-id').value = lead.id;
            
            const fields = ['name', 'mobile', 'location', 'source', 'type', 'kw', 'sysType', 'subsidy', 'value', 'quotaStatus', 'siteStatus', 'status', 'nextDate', 'notes', 'lostReason'];
            fields.forEach(f => {
                if(document.getElementById(`form-${f}`)) document.getElementById(`form-${f}`).value = lead[f] || '';
            });
            if(lead.status === 'Lost') document.getElementById('div-lost-reason').classList.remove('hidden');
        }

        function renderProfile(id) {
            const lead = appState.leads.find(l => l.id === id);
            if(!lead) { navigate('leads'); return; }

            document.getElementById('prof-name').innerText = lead.name;
            document.getElementById('prof-location').innerText = lead.location || 'No location provided';
            document.getElementById('prof-status-badge').outerHTML = getStatusBadge(lead.status);
            document.getElementById('prof-status-badge')?.setAttribute('id', 'prof-status-badge'); // retain id if replacing outerHTML

            document.getElementById('prof-type').innerText = lead.type;
            document.getElementById('prof-kw').innerText = lead.kw ? lead.kw + ' kW' : '-';
            document.getElementById('prof-sysType').innerText = lead.sysType;
            document.getElementById('prof-value').innerText = formatCurrency(lead.estValue);
            document.getElementById('prof-source').innerText = lead.source;
            document.getElementById('prof-subsidy').innerText = lead.subsidy;
            document.getElementById('prof-survey').innerText = lead.siteStatus;
            document.getElementById('prof-quota').innerText = lead.quotaStatus;
            document.getElementById('prof-notes').innerText = lead.notes || 'No general notes provided.';

            document.getElementById('btn-edit-lead').onclick = () => navigate('add-lead', lead.id);
            document.getElementById('btn-delete-lead').onclick = () => confirmDeleteLead(lead.id);
            document.getElementById('btn-call').href = `tel:${lead.mobile.replace(/\D/g, '')}`;
            document.getElementById('btn-wa').href = `https://wa.me/${lead.mobile.replace(/\D/g, '')}`;

            // History Timeline
            const histContainer = document.getElementById('prof-history');
            histContainer.innerHTML = '';
            
            // Sort history descending (newest first)
            const sortedHistory = [...(lead.history || [])].sort((a, b) => new Date(b.date) - new Date(a.date));
            
            if (sortedHistory.length === 0) {
                histContainer.innerHTML = '<p class="text-sm text-slate-400 italic">No interaction history yet.</p>';
            } else {
                sortedHistory.forEach((h, i) => {
                    const isLast = i === sortedHistory.length - 1;
                    histContainer.innerHTML += `
                        <div class="relative flex items-start gap-4">
                            <div class="absolute inset-0 ml-5 -translate-x-px md:mx-auto md:translate-x-0 h-full w-0.5 bg-slate-200 ${isLast ? 'hidden' : ''}"></div>
                            <div class="relative z-10 w-10 h-10 flex-shrink-0 bg-white border-2 border-brand-200 rounded-full flex items-center justify-center text-brand-600 shadow-sm">
                                <i data-feather="message-square" class="w-4 h-4"></i>
                            </div>
                            <div class="flex-1 bg-slate-50 rounded-xl p-4 border border-slate-100 mb-4 shadow-sm">
                                <div class="flex justify-between items-start mb-2">
                                    <span class="text-xs font-semibold text-slate-500">${formatDate(h.date, true)}</span>
                                    ${h.status ? getStatusBadge(h.status) : ''}
                                </div>
                                <p class="text-sm text-slate-700 whitespace-pre-wrap">${h.note}</p>
                            </div>
                        </div>
                    `;
                });
            }
        }

        function addInteraction(e) {
            e.preventDefault();
            const lead = appState.leads.find(l => l.id === appState.activeLeadId);
            if(!lead) return;

            const note = document.getElementById('int-note').value;
            const statusUpdate = document.getElementById('int-status').value;
            const nextDate = document.getElementById('int-nextDate').value;

            if(!lead.history) lead.history = [];
            
            lead.history.push({
                date: new Date().toISOString(),
                note: note,
                status: statusUpdate !== 'Same' ? statusUpdate : null
            });

            if (statusUpdate !== 'Same') lead.status = statusUpdate;
            if (nextDate) lead.nextDate = nextDate;

            showToast('Interaction saved!', 'success');
            renderProfile(lead.id); // re-render
        }

        function renderFollowUps() {
            const todayStr = new Date().toISOString().slice(0, 10);
            let todayArr = [], overdueArr = [];

            appState.leads.forEach(l => {
                if (!l.nextDate || l.status === 'Won' || l.status === 'Lost') return;
                const nextD = l.nextDate.slice(0, 10);
                if (nextD === todayStr) todayArr.push(l);
                else if (nextD < todayStr) overdueArr.push(l);
            });

            // Sort arrays
            overdueArr.sort((a, b) => new Date(a.nextDate) - new Date(b.nextDate));
            todayArr.sort((a, b) => new Date(a.nextDate) - new Date(b.nextDate));

            document.getElementById('count-overdue').innerText = overdueArr.length;
            document.getElementById('count-today').innerText = todayArr.length;

            const renderCard = (l) => `
                <div class="p-3 bg-white border border-slate-100 rounded-xl mb-2 shadow-sm hover:border-brand-200 transition-all cursor-pointer" onclick="navigate('profile', '${l.id}')">
                    <div class="flex justify-between items-start">
                        <div class="font-semibold text-slate-800">${l.name}</div>
                        <div class="text-xs font-medium text-slate-500">${formatDate(l.nextDate, true)}</div>
                    </div>
                    <div class="text-xs text-slate-500 mt-1">${l.mobile} • ${l.sysType}</div>
                    <div class="mt-2 flex gap-2">
                         <a href="https://wa.me/${l.mobile.replace(/\D/g, '')}" target="_blank" onclick="event.stopPropagation()" class="flex-1 py-1.5 bg-green-50 text-green-700 text-xs font-semibold rounded text-center hover:bg-green-100 transition-colors">WhatsApp</a>
                         <a href="tel:${l.mobile.replace(/\D/g, '')}" onclick="event.stopPropagation()" class="flex-1 py-1.5 bg-blue-50 text-blue-700 text-xs font-semibold rounded text-center hover:bg-blue-100 transition-colors">Call</a>
                    </div>
                </div>
            `;

            document.getElementById('list-overdue').innerHTML = overdueArr.length ? overdueArr.map(renderCard).join('') : '<p class="text-center text-slate-400 text-sm py-4">No overdue follow-ups!</p>';
            document.getElementById('list-today').innerHTML = todayArr.length ? todayArr.map(renderCard).join('') : '<p class="text-center text-slate-400 text-sm py-4">No follow-ups for today.</p>';
        }

        function updateGlobalBadges() {
            const todayStr = new Date().toISOString().slice(0, 10);
            let count = 0;
            appState.leads.forEach(l => {
                if (!l.nextDate || l.status === 'Won' || l.status === 'Lost') return;
                if (l.nextDate.slice(0, 10) <= todayStr) count++;
            });
            const badge = document.getElementById('nav-badge-followup');
            if (count > 0) {
                badge.innerText = count;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        // Data Management (CSV / JSON)
        function exportData(type) {
            if (appState.leads.length === 0) {
                showToast('No data to export', 'error');
                return;
            }

            let content, filename, mimeType;
            const dateStr = new Date().toISOString().slice(0, 10);

            if (type === 'json') {
                content = JSON.stringify(appState.leads, null, 2);
                filename = `SunTrack_Backup_${dateStr}.json`;
                mimeType = 'application/json';
            } else if (type === 'csv') {
                const headers = ['ID', 'Name', 'Mobile', 'Location', 'Source', 'Type', 'kW', 'System', 'EstValue', 'Status', 'NextDate', 'Notes'];
                const rows = appState.leads.map(l => [
                    l.id, `"${l.name}"`, l.mobile, `"${l.location||''}"`, l.source, l.type, l.kw, l.sysType, l.estValue, l.status, l.nextDate, `"${(l.notes||'').replace(/"/g, '""')}"`
                ]);
                content = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
                filename = `SunTrack_Leads_${dateStr}.csv`;
                mimeType = 'text/csv';
            }

            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
            showToast(`${type.toUpperCase()} exported successfully!`, 'success');
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (Array.isArray(data)) {
                        appState.leads = data;
                        showToast('Data restored successfully!', 'success');
                        navigate('dashboard');
                    } else {
                        showToast('Invalid backup file format.', 'error');
                    }
                } catch (err) {
                    showToast('Error reading backup file.', 'error');
                }
                event.target.value = ''; // reset input
            };
            reader.readAsText(file);
        }

        function confirmClearData() {
            showModal(
                'Erase All Data?',
                'Are you sure you want to delete all leads? This action cannot be undone. Please ensure you have downloaded a backup.',
                'danger',
                () => {
                    appState.leads = [];
                    showToast('All data cleared.', 'success');
                    navigate('dashboard');
                }
            );
        }

        function confirmDeleteLead(id) {
            const lead = appState.leads.find(l => l.id === id);
            if (!lead) return;
            
            showModal(
                'Delete Lead?',
                `Are you sure you want to permanently delete the lead for "${lead.name}"? This action cannot be undone.`,
                'danger',
                () => {
                    appState.leads = appState.leads.filter(l => l.id !== id);
                    showToast('Lead deleted successfully.', 'success');
                    navigate('leads'); // Return to leads list to reflect deletion
                }
            );
        }

        // UI Helpers
        function showModal(title, message, type = 'primary', onConfirm) {
            const modal = document.getElementById('custom-modal');
            const content = document.getElementById('modal-content');
            
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            
            const iconWrap = document.getElementById('modal-icon');
            if (type === 'danger') {
                iconWrap.className = 'w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 bg-red-100 text-red-600';
                iconWrap.innerHTML = '<i data-feather="alert-triangle"></i>';
            } else {
                iconWrap.className = 'w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 bg-blue-100 text-blue-600';
                iconWrap.innerHTML = '<i data-feather="info"></i>';
            }

            const btnClass = type === 'danger' ? 'bg-red-600 hover:bg-red-700' : 'bg-brand-600 hover:bg-brand-700';
            
            document.getElementById('modal-actions').innerHTML = `
                <button onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors">Cancel</button>
                <button id="modal-confirm-btn" class="px-4 py-2 text-sm font-medium text-white ${btnClass} rounded-lg transition-colors shadow-sm">Confirm</button>
            `;

            document.getElementById('modal-confirm-btn').onclick = () => {
                onConfirm();
                closeModal();
            };

            feather.replace();
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('custom-modal');
            const content = document.getElementById('modal-content');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 200);
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bg = type === 'success' ? 'bg-slate-800' : 'bg-red-600';
            const icon = type === 'success' ? 'check-circle' : 'x-circle';

            toast.className = `flex items-center gap-3 ${bg} text-white px-4 py-3 rounded-xl shadow-lg transform translate-y-10 opacity-0 transition-all duration-300 z-50`;
            toast.innerHTML = `<i data-feather="${icon}" class="w-5 h-5"></i> <span class="text-sm font-medium">${message}</span>`;
            
            container.appendChild(toast);
            feather.replace();

            // Animate in
            setTimeout(() => { toast.classList.remove('translate-y-10', 'opacity-0'); }, 10);
            
            // Animate out
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            navigate('dashboard');
        });

    </script>
</body>
</html>
